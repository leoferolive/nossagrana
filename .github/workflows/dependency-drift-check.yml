name: Dependency Drift Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency drift report
        run: |
          set -euo pipefail
          if pnpm deps:check > outdated.txt 2>&1; then
            echo "No dependency drift detected."
            {
              echo "## Dependency Drift Check"
              echo
              echo "No outdated dependencies detected."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Outdated dependencies detected."
            {
              echo "## Dependency Drift Check"
              echo
              echo "Outdated dependencies found:"
              echo
              echo '```text'
              cat outdated.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
