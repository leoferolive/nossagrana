# ServiceAccount dedicada e sem permissões (issue #47): o job não fala com a
# API do Kubernetes. Sem Role/RoleBinding de propósito; o token nem é montado
# no pod (automountServiceAccountToken: false aqui e no CronJob).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pg-dump-external
  labels:
    app: pg-dump-external
automountServiceAccountToken: false
