# Dump cifrado para storage externo (issue #47). Aplicação manual, separada de
# k8s/backup (o restore drill não pode conhecer Secrets — ver manifests.test.sh):
#
#   kubectl apply -k k8s/backup/pg-dump-external
#
# O CronJob nasce suspenso; ver o cabeçalho de cronjob.yaml e o runbook.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database
resources:
  - serviceaccount.yaml
  - cronjob.yaml
configMapGenerator:
  - name: pg-dump-external-script
    files:
      - pg-dump-external.sh
labels:
  - pairs:
      app.kubernetes.io/part-of: nossagrana-backup
