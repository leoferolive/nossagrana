# Alertas do pipeline de backup/restore do NossaGrana (issue #49).
# Política (RPO/RTO) em docs/backup/POLICY.md; resposta em docs/backup/RUNBOOK.md.
#
# Fonte: kube-state-metrics (CronJobs do namespace `database`) e node-exporter.
#   pg-backup                → pg_dumpall diário no PVC `postgres-backup` (03:20)
#   restic-backup            → cópia cifrada para HD USB + Google Drive (04:00)
#   pg-dump-external         → pg_dump cifrado (age) para storage externo (03:35);
#                              rollout suspenso — sem série de sucesso não há Stale; o
#                              JobNotSucceeded cobre "nunca teve sucesso"
#                              (issue #47; k8s/backup/pg-dump-external)
#   nossagrana-restore-drill → restore em banco descartável (03:50)
# Roteamento: Alertmanager do kps → Telegram (severity critical/warning).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nossagrana-backup
  labels:
    app: nossagrana
    # Exigido pelo ruleSelector do Prometheus do kube-prometheus-stack.
    release: kps
spec:
  groups:
    - name: nossagrana.backup
      interval: 1m
      rules:
        # RPO = 24h; 26h dá margem para duração do job e atraso do scheduler.
        # CronJob suspenso fica fora: um Job manual (`create job --from=cronjob`)
        # preenche `last_successful_time` do CronJob mesmo suspenso, e o rollout/
        # rollback do pg-dump-external (RUNBOOK) fica suspenso por horas. A
        # suspensão prolongada tem alerta próprio (NossaGranaBackupCronJobSuspended).
        # O 2º ramo cobre CronJob habilitado que nunca chegou a ser agendado (sem
        # last_schedule_time nem last_successful_time, ex.: controller falhando antes
        # do primeiro horário): a idade desde a criação (`kube_cronjob_created`) faz o
        # papel do "último sucesso" e 26h é a carência para o primeiro agendamento.
        - alert: NossaGranaBackupStale
          expr: |
            (
              (
                time() - kube_cronjob_status_last_successful_time{namespace="database",cronjob=~"pg-backup|restic-backup|pg-dump-external"}
                  > 26 * 3600
              )
              or
              (
                (
                  time() - kube_cronjob_created{namespace="database",cronjob=~"pg-backup|restic-backup|pg-dump-external"}
                    > 26 * 3600
                )
                unless on (namespace, cronjob)
                kube_cronjob_status_last_schedule_time{namespace="database"}
                unless on (namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace="database"}
              )
            )
            unless on (namespace, cronjob)
            (kube_cronjob_spec_suspend{namespace="database"} == 1)
          for: 15m
          labels:
            namespace: database
            severity: critical
          annotations:
            summary: 'nossagrana: backup {{ $labels.cronjob }} sem sucesso há mais de 26h (RPO violado)'
            description: '{{ $labels.cronjob }} sem sucesso há {{ $value | humanizeDuration }} (desde o último sucesso ou, se nunca houve, desde a criação do CronJob).'
            runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#backup-atrasado-ou-falhando

        # Suspender é legítimo no rollout/rollback, mas esquecido vira backup parado
        # em silêncio (o Stale acima ignora CronJobs suspensos).
        - alert: NossaGranaBackupCronJobSuspended
          expr: |
            kube_cronjob_spec_suspend{namespace="database",cronjob=~"pg-backup|restic-backup|pg-dump-external|nossagrana-restore-drill"} == 1
          for: 24h
          labels:
            namespace: database
            severity: warning
          annotations:
            summary: 'nossagrana: CronJob {{ $labels.cronjob }} suspenso há mais de 24h'
            description: '{{ $labels.cronjob }} está com spec.suspend=true; sem agendamento não há backup novo nem alerta de atraso. Reativar ou concluir o rollout.'
            runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#cronjob-suspenso

        # O último agendamento não virou sucesso 1h depois de disparar (o Job mais
        # longo, pg-dump-external, tem activeDeadlineSeconds de 30min): falha de dump,
        # tamanho mínimo, upload/restic ou restore. Resolve sozinho no próximo
        # sucesso, ao contrário do KubeJobFailed.
        # - `last_schedule_time > last_successful_time`: o sucesso é anterior ao
        #   agendamento. Numa execução normal em andamento isso vale por minutos, por
        #   isso a idade do agendamento (`time() - last_schedule_time > 3600`) é
        #   quem dá a folga; sem ela o alerta pagaria 15min após o disparo.
        # - `unless ... last_successful_time`: CronJob que nunca teve sucesso (ex.:
        #   toda execução agendada falhou após o rollout). Sem `last_successful_time`
        #   a subtração acima não produz série e o alerta ficaria mudo.
        - alert: NossaGranaBackupJobNotSucceeded
          expr: |
            (
              (
                kube_cronjob_status_last_schedule_time{namespace="database",cronjob=~"pg-backup|restic-backup|pg-dump-external|nossagrana-restore-drill"}
                  > on (namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace="database",cronjob=~"pg-backup|restic-backup|pg-dump-external|nossagrana-restore-drill"}
              )
              or
              (
                kube_cronjob_status_last_schedule_time{namespace="database",cronjob=~"pg-backup|restic-backup|pg-dump-external|nossagrana-restore-drill"}
                  unless on (namespace, cronjob)
                kube_cronjob_status_last_successful_time{namespace="database",cronjob=~"pg-backup|restic-backup|pg-dump-external|nossagrana-restore-drill"}
              )
            )
            and on (namespace, cronjob)
            (time() - kube_cronjob_status_last_schedule_time{namespace="database"} > 3600)
          for: 15m
          labels:
            namespace: database
            severity: critical
          annotations:
            summary: 'nossagrana: última execução de {{ $labels.cronjob }} não teve sucesso'
            description: 'O agendamento mais recente de {{ $labels.cronjob }} não concluiu com sucesso. Ver logs do último Job.'
            runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#backup-atrasado-ou-falhando

        # Restore comprovado: sem drill bem-sucedido em 26h, não há garantia de que
        # o backup mais recente é restaurável.
        - alert: NossaGranaRestoreDrillStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="database",cronjob="nossagrana-restore-drill"}
              > 26 * 3600
          for: 15m
          labels:
            namespace: database
            severity: critical
          annotations:
            summary: 'nossagrana: restore drill sem sucesso há mais de 26h'
            description: 'Último restore comprovado há {{ $value | humanizeDuration }}.'
            runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#restore-drill-falhando

        # CronJob removido/renomeado: as regras acima ficariam silenciosas.
        - alert: NossaGranaBackupCronJobMissing
          expr: |
            absent(kube_cronjob_info{namespace="database",cronjob="pg-backup"})
              or absent(kube_cronjob_info{namespace="database",cronjob="restic-backup"})
              or absent(kube_cronjob_info{namespace="database",cronjob="pg-dump-external"})
              or absent(kube_cronjob_info{namespace="database",cronjob="nossagrana-restore-drill"})
          for: 1h
          labels:
            namespace: database
            severity: critical
          annotations:
            summary: 'nossagrana: CronJob {{ $labels.cronjob }} de backup/restore não existe no cluster'
            description: 'Sem o CronJob, o pipeline de backup para em silêncio. Reaplicar os manifests.'
            runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#cronjob-ausente

        # "/" guarda o PVC postgres-backup (local-path); /srv/backups o repo restic local.
        - alert: NossaGranaBackupDiskLow
          expr: |
            node_filesystem_avail_bytes{mountpoint=~"/|/srv/backups",fstype!~"tmpfs|overlay"}
              / node_filesystem_size_bytes{mountpoint=~"/|/srv/backups",fstype!~"tmpfs|overlay"}
              < 0.10
          for: 30m
          labels:
            namespace: database
            severity: warning
          annotations:
            summary: 'nossagrana: menos de 10% livre em {{ $labels.mountpoint }} (destino de backup)'
            description: '{{ $value | humanizePercentage }} livre em {{ $labels.mountpoint }}; próximos backups podem falhar.'
            runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#espaço-em-disco
