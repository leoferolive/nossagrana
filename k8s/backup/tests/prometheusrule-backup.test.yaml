# Testes das regras de alerta de backup (issue #49) com séries sintéticas.
# Rodar: bash k8s/backup/tests/prometheusrule-backup.test.sh
# Intervalo de 1m; `time()` = tempo de avaliação em segundos desde 0.
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # Saudável: backups de 1h atrás, execução mais recente bem-sucedida, disco ok.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="pg-backup"}'
        values: '3600x120'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="database",cronjob="pg-backup"}'
        values: '3500x120'
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="restic-backup"}'
        values: '3600x120'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="database",cronjob="restic-backup"}'
        values: '3500x120'
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="nossagrana-restore-drill"}'
        values: '3600x120'
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="pg-dump-external"}'
        values: '3600x120'
      - series: 'kube_cronjob_status_last_schedule_time{namespace="database",cronjob="pg-dump-external"}'
        values: '3500x120'
      - series: 'kube_cronjob_info{namespace="database",cronjob="pg-dump-external"}'
        values: '1x120'
      - series: 'kube_cronjob_info{namespace="database",cronjob="pg-backup"}'
        values: '1x120'
      - series: 'kube_cronjob_info{namespace="database",cronjob="restic-backup"}'
        values: '1x120'
      - series: 'kube_cronjob_info{namespace="database",cronjob="nossagrana-restore-drill"}'
        values: '1x120'
      - series: 'node_filesystem_avail_bytes{mountpoint="/srv/backups",fstype="ext4"}'
        values: '500x120'
      - series: 'node_filesystem_size_bytes{mountpoint="/srv/backups",fstype="ext4"}'
        values: '1000x120'
    alert_rule_test:
      - eval_time: 2h
        alertname: NossaGranaBackupStale
        exp_alerts: []
      - eval_time: 2h
        alertname: NossaGranaBackupJobNotSucceeded
        exp_alerts: []
      - eval_time: 2h
        alertname: NossaGranaRestoreDrillStale
        exp_alerts: []
      - eval_time: 2h
        alertname: NossaGranaBackupCronJobMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: NossaGranaBackupDiskLow
        exp_alerts: []

  # pg-backup parou de ter sucesso: último sucesso em t=0, avaliado em 27h (> RPO+margem).
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="pg-backup"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: NossaGranaBackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: NossaGranaBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: pg-backup
            exp_annotations:
              summary: 'nossagrana: backup pg-backup sem sucesso há mais de 26h (RPO violado)'
              description: 'Último sucesso de pg-backup há 1d 3h 0m 0s.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#backup-atrasado-ou-falhando

  # restic-backup (cópia off-site) agendado há 2h (t=3600 -> avaliação em 3h) sem
  # sucesso novo: o último sucesso (t=0) é anterior ao agendamento.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="database",cronjob="restic-backup"}'
        values: '3600x240'
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="restic-backup"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: NossaGranaBackupJobNotSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: restic-backup
            exp_annotations:
              summary: 'nossagrana: última execução de restic-backup não teve sucesso'
              description: 'O agendamento mais recente de restic-backup não concluiu com sucesso. Ver logs do último Job.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#backup-atrasado-ou-falhando

  # Execução normal em andamento (Codex P2, PR #143): o agendamento de hoje
  # (t=86400) já é mais novo que o sucesso de ontem (t=0), mas o Job tem até 30min
  # (activeDeadlineSeconds do pg-dump-external). Nem o `for: 15m` pode paginar antes
  # de o Job acabar: a idade do agendamento precisa passar de 1h primeiro.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="database",cronjob="pg-dump-external"}'
        values: '86400x1600'
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="pg-dump-external"}'
        values: '0x1600'
    alert_rule_test:
      - eval_time: 24h25m
        alertname: NossaGranaBackupJobNotSucceeded
        exp_alerts: []
      - eval_time: 24h59m
        alertname: NossaGranaBackupJobNotSucceeded
        exp_alerts: []

  # CronJob que nunca teve sucesso (Codex P1, PR #143): o Job manual do rollout
  # (`create job --from=cronjob`) não tem ownerRef e não preenche
  # last_successful_time. Habilitado, se toda execução agendada falha, só existe a
  # série last_schedule_time. Sem sucesso 1h+ após o agendamento, alerta.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="database",cronjob="pg-dump-external"}'
        values: '86400x1600'
      - series: 'kube_cronjob_spec_suspend{namespace="database",cronjob="pg-dump-external"}'
        values: '0x1600'
    alert_rule_test:
      - eval_time: 24h20m
        alertname: NossaGranaBackupJobNotSucceeded
        exp_alerts: []
      - eval_time: 26h
        alertname: NossaGranaBackupJobNotSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: pg-dump-external
            exp_annotations:
              summary: 'nossagrana: última execução de pg-dump-external não teve sucesso'
              description: 'O agendamento mais recente de pg-dump-external não concluiu com sucesso. Ver logs do último Job.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#backup-atrasado-ou-falhando

  # Restore drill sem sucesso há 27h.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="nossagrana-restore-drill"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 27h
        alertname: NossaGranaRestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: nossagrana-restore-drill
            exp_annotations:
              summary: 'nossagrana: restore drill sem sucesso há mais de 26h'
              description: 'Último restore comprovado há 1d 3h 0m 0s.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#restore-drill-falhando

  # CronJob do drill removido: só ele aparece como ausente.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="database",cronjob="pg-dump-external"}'
        values: '1x120'
      - series: 'kube_cronjob_info{namespace="database",cronjob="pg-backup"}'
        values: '1x120'
      - series: 'kube_cronjob_info{namespace="database",cronjob="restic-backup"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: NossaGranaBackupCronJobMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: nossagrana-restore-drill
            exp_annotations:
              summary: 'nossagrana: CronJob nossagrana-restore-drill de backup/restore não existe no cluster'
              description: 'Sem o CronJob, o pipeline de backup para em silêncio. Reaplicar os manifests.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#cronjob-ausente

  # pg-dump-external (issue #47): último sucesso há 27h => RPO violado.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="pg-dump-external"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 27h
        alertname: NossaGranaBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: pg-dump-external
            exp_annotations:
              summary: 'nossagrana: backup pg-dump-external sem sucesso há mais de 26h (RPO violado)'
              description: 'Último sucesso de pg-dump-external há 1d 3h 0m 0s.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#backup-atrasado-ou-falhando

  # pg-dump-external agendado, mas o último agendamento falhou (upload, cifragem...).
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="database",cronjob="pg-dump-external"}'
        values: '3600x240'
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="pg-dump-external"}'
        values: '0x240'
    alert_rule_test:
      - eval_time: 3h
        alertname: NossaGranaBackupJobNotSucceeded
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: pg-dump-external
            exp_annotations:
              summary: 'nossagrana: última execução de pg-dump-external não teve sucesso'
              description: 'O agendamento mais recente de pg-dump-external não concluiu com sucesso. Ver logs do último Job.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#backup-atrasado-ou-falhando

  # pg-dump-external suspenso e nunca executado (rollout inicial): sem série de
  # sucesso não há alerta de atraso; o CronJob existe, então não está "ausente".
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="database",cronjob="pg-dump-external"}'
        values: '1x600'
      - series: 'kube_cronjob_info{namespace="database",cronjob="pg-backup"}'
        values: '1x600'
      - series: 'kube_cronjob_info{namespace="database",cronjob="restic-backup"}'
        values: '1x600'
      - series: 'kube_cronjob_info{namespace="database",cronjob="nossagrana-restore-drill"}'
        values: '1x600'
    alert_rule_test:
      - eval_time: 9h
        alertname: NossaGranaBackupStale
        exp_alerts: []
      - eval_time: 9h
        alertname: NossaGranaBackupJobNotSucceeded
        exp_alerts: []
      - eval_time: 9h
        alertname: NossaGranaBackupCronJobMissing
        exp_alerts: []

  # pg-dump-external suspenso, com sucesso de um Job manual (ownerRef preenche
  # last_successful_time do CronJob) e restore completo ainda pendente: passadas
  # 27h do sucesso não há Stale critical; só o aviso de suspensão após 24h.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="pg-dump-external"}'
        values: '0x1700'
      - series: 'kube_cronjob_spec_suspend{namespace="database",cronjob="pg-dump-external"}'
        values: '1x1700'
    alert_rule_test:
      - eval_time: 27h
        alertname: NossaGranaBackupStale
        exp_alerts: []
      - eval_time: 23h
        alertname: NossaGranaBackupCronJobSuspended
        exp_alerts: []
      - eval_time: 25h
        alertname: NossaGranaBackupCronJobSuspended
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: database
              cronjob: pg-dump-external
            exp_annotations:
              summary: 'nossagrana: CronJob pg-dump-external suspenso há mais de 24h'
              description: 'pg-dump-external está com spec.suspend=true; sem agendamento não há backup novo nem alerta de atraso. Reativar ou concluir o rollout.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#cronjob-suspenso

  # Reativado (suspend=0) com o último sucesso antigo: Stale volta a valer.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="database",cronjob="pg-dump-external"}'
        values: '0x1700'
      - series: 'kube_cronjob_spec_suspend{namespace="database",cronjob="pg-dump-external"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 27h
        alertname: NossaGranaBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: pg-dump-external
            exp_annotations:
              summary: 'nossagrana: backup pg-dump-external sem sucesso há mais de 26h (RPO violado)'
              description: 'Último sucesso de pg-dump-external há 1d 3h 0m 0s.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#backup-atrasado-ou-falhando
      - eval_time: 27h
        alertname: NossaGranaBackupCronJobSuspended
        exp_alerts: []

  # CronJob pg-dump-external ausente: só ele aparece.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_info{namespace="database",cronjob="pg-backup"}'
        values: '1x120'
      - series: 'kube_cronjob_info{namespace="database",cronjob="restic-backup"}'
        values: '1x120'
      - series: 'kube_cronjob_info{namespace="database",cronjob="nossagrana-restore-drill"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: NossaGranaBackupCronJobMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cronjob: pg-dump-external
            exp_annotations:
              summary: 'nossagrana: CronJob pg-dump-external de backup/restore não existe no cluster'
              description: 'Sem o CronJob, o pipeline de backup para em silêncio. Reaplicar os manifests.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#cronjob-ausente

  # Disco de destino com 5% livre por mais de 30min.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/srv/backups",fstype="ext4"}'
        values: '50x60'
      - series: 'node_filesystem_size_bytes{mountpoint="/srv/backups",fstype="ext4"}'
        values: '1000x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: NossaGranaBackupDiskLow
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: database
              mountpoint: /srv/backups
              fstype: ext4
            exp_annotations:
              summary: 'nossagrana: menos de 10% livre em /srv/backups (destino de backup)'
              description: '5% livre em /srv/backups; próximos backups podem falhar.'
              runbook_url: https://github.com/leoferolive/nossagrana/blob/main/docs/backup/RUNBOOK.md#espaço-em-disco
