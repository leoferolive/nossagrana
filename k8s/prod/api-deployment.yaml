apiVersion: apps/v1
kind: Deployment
metadata:
  name: nossagrana-api
  namespace: nossagrana
spec:
  replicas: 1
  # Recreate: tickets de WebSocket (#118), eventBus e WebSocketManager vivem na memória de um único
  # pod; num rolling update o pod velho e o novo ficam atrás do mesmo Service e um ticket emitido
  # num deles seria recusado no outro. `rollingUpdate: null` é necessário para o `kubectl apply`
  # sair do RollingUpdate padrão.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: nossagrana-api
  template:
    metadata:
      labels:
        app: nossagrana-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: nossagrana-api
          image: ghcr.io/leoferolive/nossagrana-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - secretRef:
                name: nossagrana-api-secrets
            - configMapRef:
                name: nossagrana-api-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
