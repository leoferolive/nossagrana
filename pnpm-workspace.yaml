packages:
  - 'apps/*'
  - 'packages/*'

# Hardening de supply-chain (settings do pnpm 10) — ver issue #34
minimumReleaseAge: 10080 # espera 7 dias antes de instalar versoes recem-publicadas
blockExoticSubdeps: true # bloqueia subdependencias de fontes nao-registry (git, etc.)
trustPolicy: no-downgrade # impede que updates rebaixem settings de seguranca

# Excecao restrita e deliberada ao trustPolicy (nao desliga a policy nem mexe no minimumReleaseAge):
# rollup@2.80.0 (via workbox-build -> vite-plugin-pwa) e a UNICA versao 2.x corrigida do advisory
# GHSA-mw96-cpmx-2vgc / CVE-2026-27606 (path traversal), mas foi publicada sem trust evidence
# (versoes 2.x anteriores tinham trusted publisher), o que dispara ERR_PNPM_TRUST_DOWNGRADE.
# Nao existe alternativa 2.x segura; remover quando workbox-build migrar para rollup >= 3.30/4.59.
trustPolicyExclude:
  - rollup@2.80.0
